<head>

    <style>
        .nav {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 12px;
            position: relative;
            z-index: 1;
        }

        .nav a {
            color: #ffffff;
            text-decoration: none;
            padding: 12px 18px;
            border-radius: 999px;
            background: rgba(0, 0, 0, 0.75);
            border: 1px solid rgba(213, 15, 121, 0.7);
            font-weight: bold;
            box-shadow: 0 0 12px rgba(0,229,255,0.18);
            transition: all 0.25s ease;
        }

        .nav a:hover {
            background: linear-gradient(135deg, #ff3b30, #00e5ff);
            color: #ffffff;
            transform: translateY(-3px) scale(1.03);
            box-shadow: 0 0 16px rgba(0,229,255,0.35);
        }
    </style>
</head>
<body>
    <div id="clock" class="clock" aria-live="polite"></div>
    <div id="date" class="date" aria-live="polite"></div>

        </a>
    </div>

    <script>
        const clockEl = document.getElementById('clock');
        const dateEl = document.getElementById('date');

        function updateClock() {
            const now = new Date();

            const formatterTime = new Intl.DateTimeFormat('de-DE', {
                timeZone: 'Europe/Berlin',
                hour: '2-digit',
                minute: '2-digit',
                hour12: false
            });

            const formatterDate = new Intl.DateTimeFormat('de-DE', {
                timeZone: 'Europe/Berlin',
                weekday: 'long',
                day: '2-digit',
                month: '2-digit',
                year: 'numeric'
            });

            clockEl.textContent = formatterTime.format(now) + ' Uhr';
            dateEl.textContent = formatterDate.format(now);
        }

        updateClock();
        setInterval(updateClock, 1000);
    </script>
</body>
</html>
