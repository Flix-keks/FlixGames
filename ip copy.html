<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body {
            background: black;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        button {
            background: black;
            color: cyan;
            border: 2px solid cyan;
            padding: 10px 20px;
            font-size: 16px;
            box-shadow: 0 0 10px cyan;
            transition: all 0.3s ease;
            cursor: pointer;
        }

        button:hover {
            box-shadow: 0 0 10px cyan, 0 0 40px cyan;
            transform: scale(1.05);
        }
    </style 
    <button>ip</button>
</body>
</html>
