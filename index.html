<!DOCTYPE html>
<html lang="de">
<head>

    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: radial-gradient(circle at top, #3b82f6 0%, #0f172a 45%, #020617 100%);
            color: white;
            font-family: Arial, sans-serif;
            text-align: center;
            overflow: hidden;
            position: relative;
        }

        body::before {
            content: "";
            position: absolute;
            inset: 0;
            background: linear-gradient(120deg, rgba(0,229,255,0.15), transparent 40%, rgba(255,59,48,0.12));
            pointer-events: none;
        }

        h1 {
            margin-bottom: 20px;
            font-size: 3rem;
            font-weight: 900;
            letter-spacing: 2px;
            background: linear-gradient(90deg, #ff3b30, #00e5ff, #8b5cf6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            color: transparent;
            text-shadow: 0 0 18px rgba(0,229,255,0.25);
        }

        .clock {
            position: fixed;
            top: 20px;
            left: 20px;
            z-index: 10;
            color: #e2f7ff;
            background: rgba(2, 6, 23, 0.65);
            padding: 10px 14px;
            border-radius: 999px;
            border: 1px solid rgba(0,229,255,0.45);
            box-shadow: 0 0 12px rgba(0,229,255,0.15);
            font-size: 1rem;
            font-weight: 700;
            letter-spacing: 0.5px;
        }

        .date {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 10;
            color: #e2f7ff;
            background: rgba(2, 6, 23, 0.65);
            padding: 10px 14px;
            border-radius: 999px;
            border: 1px solid rgba(0,229,255,0.45);
            box-shadow: 0 0 12px rgba(0,229,255,0.15);
            font-size: 1rem;
            font-weight: 700;
            letter-spacing: 0.5px;
        }

        .nav {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 12px;
            position: relative;
            z-index: 1;
        }

        .nav a {
            color: #ffffff;
            text-decoration: none;
            padding: 12px 18px;
            border-radius: 999px;
            background: rgba(0, 0, 0, 0.75);
            border: 1px solid rgba(213, 15, 121, 0.7);
            font-weight: bold;
            box-shadow: 0 0 12px rgba(0,229,255,0.18);
            transition: all 0.25s ease;
        }

        .nav a:hover {
            background: linear-gradient(135deg, #ff3b30, #00e5ff);
            color: #ffffff;
            transform: translateY(-3px) scale(1.03);
            box-shadow: 0 0 16px rgba(0,229,255,0.35);
        }
    </style>
</head>
<body>
    <div id="clock" class="clock" aria-live="polite"></div>
    <div id="date" class="date" aria-live="polite"></div>

    <h1>Prod by FlixGames</h1>

    <div class="nav">
        <a href="index.html">Home</a>
        <a href="">Comming Soon</a>
        <a href="MinecraftHelden.html">Minecraft Helden youtuber</a>
        <a href="Discord.html">discord</a>
        <a href="ip.html">ip</a>
        <a href="">Comming Soon</a>
    </div>

    <script>
        const clockEl = document.getElementById('clock');
        const dateEl = document.getElementById('date');

        function updateClock() {
            const now = new Date();

            const formatterTime = new Intl.DateTimeFormat('de-DE', {
                timeZone: 'Europe/Berlin',
                hour: '2-digit',
                minute: '2-digit',
                hour12: false
            });

            const formatterDate = new Intl.DateTimeFormat('de-DE', {
                timeZone: 'Europe/Berlin',
                weekday: 'long',
                day: '2-digit',
                month: '2-digit',
                year: 'numeric'
            });

            clockEl.textContent = formatterTime.format(now) + ' Uhr';
            dateEl.textContent = formatterDate.format(now);
        }

        updateClock();
        setInterval(updateClock, 1000);
    </script>
</body>
</html>
